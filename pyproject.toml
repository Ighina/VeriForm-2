[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriform2"
version = "0.1.0"
description = "VeriForm: verifying LLM mathematical reasoning traces by routing steps between Python and Lean verifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eleanor Fan" }, { name = "Iacopo Ghinassi" }]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.26",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
interpretability = ["captum>=0.7"]
openai = ["openai>=1.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["veriform2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
